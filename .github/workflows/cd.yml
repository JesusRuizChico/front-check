name: CD Frontend (front-check)

# ============================================================
# Pipeline de Despliegue Continuo (CD) — Frontend Flutter
#
# Se ejecuta automáticamente cuando el pipeline de CI pasa en
# la rama `develop` (staging) o `main` (producción).
#
# Secretos requeridos en GitHub (Settings > Secrets):
#   KEYSTORE_B64          → Keystore JKS codificado en base64
#                           (comando: base64 -w 0 habitacheck.jks)
#   KEYSTORE_PASSWORD     → Contraseña del keystore
#   KEY_ALIAS             → Alias de la clave dentro del keystore
#   KEY_PASSWORD          → Contraseña de la clave privada
#   FIREBASE_KEY_B64      → keys.json de Firebase codificado en base64
# ============================================================

on:
  workflow_run:
    workflows: ["CI Frontend (front-check)"]
    types: [completed]
    branches: [develop, main]

  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de despliegue"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  FLUTTER_VERSION: "3.32.x"

jobs:
  # ── Job 1: Verificar que CI pasó ──────────────────────────
  check-ci:
    name: Verificar que CI pasó
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    outputs:
      should-deploy: ${{ steps.check.outputs.deploy }}
      environment: ${{ steps.check.outputs.env }}
    steps:
      - name: Determinar ambiente de despliegue
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
              echo "env=production" >> $GITHUB_OUTPUT
            else
              echo "env=staging" >> $GITHUB_OUTPUT
            fi
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "env=none" >> $GITHUB_OUTPUT
          fi

  # ── Job 2: Build APK de Staging (debug firmado) ───────────
  build-apk-staging:
    name: Build APK Staging
    runs-on: ubuntu-latest
    needs: check-ci
    if: >
      needs.check-ci.outputs.should-deploy == 'true' &&
      needs.check-ci.outputs.environment == 'staging'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17 (requerido por Android SDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Cambiar URL del backend a staging
        run: |
          # Reemplazar la URL del emulador (10.0.2.2) con la URL de staging
          sed -i "s|10\.0\.2\.2:8080|api-staging.habitacheck.example.com|g" lib/core/network/api_client.dart
          sed -i "s|localhost:8080|api-staging.habitacheck.example.com|g" lib/core/network/api_client.dart

      - name: Build APK debug (staging)
        run: flutter build apk --debug --flavor staging 2>/dev/null || flutter build apk --debug

      - name: Renombrar APK con versión
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d "'\"")
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/habitacheck-staging-${VERSION}-${SHA}.apk
          echo "APK_FILE=habitacheck-staging-${VERSION}-${SHA}.apk" >> $GITHUB_ENV
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Publicar APK de staging como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-staging-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Resumen del build staging
        run: |
          echo "## 📱 APK Staging generado" >> $GITHUB_STEP_SUMMARY
          echo "**Archivo:** \`${{ env.APK_FILE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Versión:** \`${{ env.APK_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Descargable desde:** Pestaña Artifacts de esta ejecución" >> $GITHUB_STEP_SUMMARY

  # ── Job 3: Build APK Release firmado (producción) ─────────
  build-apk-release:
    name: Build APK Release (firmado)
    runs-on: ubuntu-latest
    needs: check-ci
    if: >
      needs.check-ci.outputs.should-deploy == 'true' &&
      needs.check-ci.outputs.environment == 'production'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Cambiar URL del backend a producción
        run: |
          sed -i "s|10\.0\.2\.2:8080|api.habitacheck.example.com|g" lib/core/network/api_client.dart
          sed -i "s|localhost:8080|api.habitacheck.example.com|g" lib/core/network/api_client.dart

      - name: Preparar keystore de firmado
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/habitacheck.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=habitacheck.jks
          EOF

      - name: Build APK Release firmado
        run: flutter build apk --release

      - name: Build App Bundle (AAB) para Google Play
        run: flutter build appbundle --release

      - name: Obtener versión del pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d "'\"")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Renombrar artefactos con versión
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/habitacheck-v${{ steps.version.outputs.version }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/habitacheck-v${{ steps.version.outputs.version }}.aab

      - name: Limpiar archivos sensibles del keystore
        if: always()
        run: |
          rm -f android/app/habitacheck.jks
          rm -f android/key.properties

      - name: Publicar APK como artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Crear GitHub Release con el APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "HabitaCheck v${{ steps.version.outputs.version }}"
          body: |
            ## 🏠 HabitaCheck — Release v${{ steps.version.outputs.version }}

            ### Descargas
            | Archivo | Descripción |
            |---------|-------------|
            | `habitacheck-v${{ steps.version.outputs.version }}.apk` | APK firmado para instalación directa (Android) |
            | `habitacheck-v${{ steps.version.outputs.version }}.aab` | App Bundle para Google Play Store |

            ### Cambios
            Ver [commits](${{ github.server_url }}/${{ github.repository }}/commits/main) para el historial completo de cambios.

            ### Instalación directa (APK)
            1. Descarga el archivo `.apk`
            2. En tu Android: Ajustes → Seguridad → Instalar desde fuentes desconocidas ✓
            3. Abre el archivo descargado e instala
          files: |
            dist/habitacheck-v${{ steps.version.outputs.version }}.apk
            dist/habitacheck-v${{ steps.version.outputs.version }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen del release
        run: |
          echo "## 🚀 Release de Producción publicado" >> $GITHUB_STEP_SUMMARY
          echo "**Versión:** \`v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** \`habitacheck-v${{ steps.version.outputs.version }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "**AAB:** \`habitacheck-v${{ steps.version.outputs.version }}.aab\`" >> $GITHUB_STEP_SUMMARY

