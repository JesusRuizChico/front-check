name: CI Frontend (front-check)
 
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}
 
jobs:
  build-and-test:
    name: Análisis y pruebas (Flutter)
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo
 
      - name: Configurar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - name: Instalar dependencias (flutter pub get)
        run: flutter pub get
 
      - name: Análisis estático (flutter analyze)
        run: flutter analyze
 
      - name: Formato de código (dart format --set-exit-if-changed)
        run: dart format --output=none --set-exit-if-changed .
 
      - name: Ejecutar pruebas (flutter test)
        run: flutter test --coverage
 
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/
          retention-days: 7
 
      - name: Análisis de calidad (SonarQube)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
 
      - name: Build web (flutter build web)
        if: github.event_name == 'push'
        run: flutter build web --release
 
      - name: Publicar el build web
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-build
          path: build/web/
          retention-days: 7
 
  notificar-fallo:
    name: Notificar fallo (Discord)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: failure()
    steps:
      - name: Enviar mensaje al webhook de Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
          AUTOR: ${{ github.actor }}
          EVENTO: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg repo "$REPO" --arg rama "$RAMA" --arg autor "$AUTOR" \
            --arg evento "$EVENTO" --arg commit "${COMMIT:0:7}" --arg url "$URL_RUN" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: "❌ Falló el pipeline del frontend",
                url: $url,
                color: 15158332,
                fields: [
                  {name: "Repositorio", value: $repo, inline: true},
                  {name: "Rama", value: $rama, inline: true},
                  {name: "Autor", value: $autor, inline: true},
                  {name: "Evento", value: $evento, inline: true},
                  {name: "Commit", value: $commit, inline: true}
                ],
                description: ("[Ver ejecución en GitHub Actions](" + $url + ")")
              }]
            }')
          curl -sS -f -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
